server:
  listen: ":8080"

# 调度策略: order（默认，优先用第一个可用后端） 或 balance（轮询均分）
strategy: "order"

# 故障转移: failover（默认，指定模型不可用时自动切换到其他可用模型） 或 failed（直接返回错误）
fallback: "failover"

health_check:
  interval: 60        # 健康检查间隔（秒）
  timeout: 30         # 单次检查超时（秒）
  message: "return i"    # 健康检查发送的消息
  expected: "i"   # 期望返回内容

backends:
  # 同一个模型可以配置在多个后端，请求时按顺序 fallback
  - name: "openai-primary"
    base_url: "https://api.openai.com/v1"
    api_key: "sk-xxxx"
    models:
      - "gpt-4o"
      - "gpt-4o-mini"

  - name: "openai-backup"
    base_url: "https://api.openai-backup.com/v1"
    api_key: "sk-yyyy"
    models:
      - "gpt-4o"

  - name: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "sk-xxxx"
    model: "deepseek-chat"    # 单模型也兼容

  - name: "local-ollama"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    models:
      - "llama3"
      - "qwen2"

  # Embedding 模型后端
  - name: "openai-embedding"
    type: "embedding"
    base_url: "https://api.openai.com/v1"
    api_key: "sk-xxxx"
    models:
      - "text-embedding-3-small"
      - "text-embedding-3-large"
